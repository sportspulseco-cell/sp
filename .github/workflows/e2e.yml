name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Production browser tests run only after every app serves this commit.
jobs:
  playwright:
    name: Playwright (production aliases)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm -r --workspace-concurrency=1 typecheck

      - name: Install Playwright browsers
        if: github.event_name == 'push'
        run: pnpm test:e2e:install

      - name: Wait for production deployments
        if: github.event_name == 'push'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/wait-for-vercel.mjs

      - name: Run Playwright tests
        if: github.event_name == 'push'
        env:
          E2E_TARGET: prod
          CI: "1"
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
